name: metrics-snapshot

on:
  schedule:
    # Twice a week: the traffic API only keeps 14 days, so one failed run
    # still leaves the next run inside the window.
    - cron: "17 1 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the metrics ledger branch
        run: |
          git config user.name "metrics-snapshot"
          git config user.email "actions@github.com"
          if git fetch origin metrics 2>/dev/null; then
            git worktree add ../metrics origin/metrics -b metrics
          else
            git worktree add --detach ../metrics
            cd ../metrics
            git checkout --orphan metrics
            git rm -rf --quiet . || true
            echo "# CozyClay metrics ledger (appended by .github/workflows/metrics.yml)" > README.md
          fi
      - name: Append snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/metrics-snapshot.mjs ../metrics/data
      - name: Commit and push
        run: |
          cd ../metrics
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "metrics: snapshot $(date -u +%F)"
            git push origin HEAD:metrics
          fi
