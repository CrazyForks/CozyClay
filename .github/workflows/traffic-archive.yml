name: Archive traffic stats

# GitHub only keeps repository traffic for 14 days, so the numbers that say
# which post actually landed are gone before a month can be compared. This
# snapshots them into .metrics/ as a permanent time series.
#
# The traffic endpoints require repository admin rights, which the built-in
# GITHUB_TOKEN does not have (it 403s). So this job only runs when a token with
# those rights is present as the TRAFFIC_TOKEN secret. Without it the job skips
# quietly instead of failing every morning, and the same archiving can be run
# locally with `npm run metrics:traffic`.

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: guard
        run: |
          if [ -n "${{ secrets.TRAFFIC_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "TRAFFIC_TOKEN is not set - skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.guard.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_REPO: ${{ github.repository }}
        run: node tools/metrics/archive-traffic.mjs

      - if: steps.guard.outputs.ok == 'true'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain .metrics)" ]; then
            echo "no traffic changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .metrics
          git commit -m "chore(metrics): archive traffic for $(date -u +%Y-%m-%d)"
          git push
